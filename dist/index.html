<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e17"><title>Atlas</title><link rel="stylesheet" href="style.css?v=6"></head>
<body>
<header><a class="brand" href="./" aria-label="Atlas, inicio"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2v32M2 18h32M7 7l22 22M7 29 29 7"/></svg><span>atlas</span></a><div class="header-actions"><button id="export">Exportar <span aria-hidden="true">↗</span></button><label class="upload">Importar <span aria-hidden="true">＋</span><input id="file" type="file" accept=".bib,.bibtex,.json" aria-label="Importar bibliografía"></label></div></header>
<main><h1>Tu investigación en perspectiva.</h1><section class="universe" aria-label="Universo de artículos"><button id="readingToggle" class="reading-toggle" aria-expanded="false" aria-controls="readingPanel">Ruta de lectura <span id="readingCount"></span></button><aside id="readingPanel" class="reading-panel" hidden aria-label="Ruta de lectura"><div class="reading-heading"><h2>Tu ruta de lectura</h2><button id="closeReading" aria-label="Cerrar ruta de lectura">×</button></div><label class="reading-switch"><span>Ruta activa</span><input id="readingSwitch" type="checkbox" role="switch" aria-label="Activar o desactivar ruta de lectura"></label><div class="reading-actions"><button id="suggestReading">Sugerir orden</button><button id="continueReading">Continuar ↗</button></div><p id="readingProgress" aria-live="polite"></p><ol id="readingList"></ol><p id="readingEmpty">Añade artículos desde sus tarjetas o empieza con un orden sugerido.</p></aside><div class="topic-filter"><button id="topicsToggle" aria-expanded="false" aria-controls="topicsPanel">Temas <span id="topicCount">Todos</span><span aria-hidden="true">⌄</span></button><div id="topicsPanel" hidden><button id="allTopics">Todos los temas</button><div id="topicsList" role="group" aria-label="Filtrar por tema"></div></div></div><svg id="graph" tabindex="-1" viewBox="0 0 1200 720" aria-label="Grafo tridimensional de artículos. Arrastra para girar y usa la rueda para acercar."><defs><radialGradient id="orb" cx="30%" cy="25%" r="75%"><stop offset="0" stop-color="#f0ffff"/><stop offset=".24" stop-color="#b5e7e9"/><stop offset=".6" stop-color="#6d9dab"/><stop offset="1" stop-color="#263e60"/></radialGradient><radialGradient id="orbActive" cx="30%" cy="25%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#e5ffff"/><stop offset=".6" stop-color="#9be8ee"/><stop offset="1" stop-color="#3c8dba"/></radialGradient><radialGradient id="halo"><stop stop-color="#8be2ed" stop-opacity=".35"/><stop offset="1" stop-color="#8be2ed" stop-opacity="0"/></radialGradient><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="7"/></filter><marker id="arrow" markerWidth="7" markerHeight="7" refX="18" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 0 6 6 3z" fill="#b4e5ef"/></marker></defs><g id="topicLayer" aria-hidden="true"></g><g id="edgeLayer"></g><g id="nodeLayer"></g></svg>
<div id="empty" hidden><button id="example">Explorar ejemplo</button></div>
<div class="universe-controls"><button id="enrich" title="Consultar resúmenes y citas en Crossref" aria-label="Actualizar metadatos de Crossref">↻</button><button id="fit" title="Centrar universo" aria-label="Centrar universo">⌖</button></div>
<article id="card" class="article-card" hidden aria-label="Artículo seleccionado"><button id="closeCard" class="close" aria-label="Cerrar tarjeta">×</button><h2 id="cardTitle"></h2><button id="summarize" class="summary-button">Resumir artículo <span aria-hidden="true">↗</span></button><button id="markRead" class="mark-read" aria-pressed="false">Marcar como leído</button><button id="addReading" class="add-reading">Añadir a mi ruta ＋</button><div id="summary" hidden aria-live="polite"></div></article>
</section><div id="notice" role="status" hidden></div></main>
<script type="module" src="app.js?v=6"></script></body></html>
